<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Cat Spa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20261026">

    <style>
        /* ซ่อนปุ่มเปิด/ปิดรหัสผ่านเริ่มต้นของเบราว์เซอร์ Edge / Windows ไม่ให้แสดงซ้อนกับปุ่มของระบบ */
        .password-field-wrapper input::-ms-reveal,
        .password-field-wrapper input::-ms-clear,
        input::-ms-reveal,
        input::-ms-clear {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            pointer-events: none !important;
        }
        input::-webkit-credentials-auto-fill-button {
            visibility: hidden !important;
            position: absolute !important;
            right: 0 !important;
        }
    </style>
</head>

<body class="auth-page">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/cat-spa-logo.png') }}" alt="Cat Spa & Grooming logo" class="auth-brand-logo">
        </div>

        <h1>เข้าสู่ระบบ</h1>

        <p class="auth-subtitle">
            ยินดีต้อนรับกลับสู่ Cat Spa
        </p>

        <!-- แสดงข้อความแจ้งเตือน -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login_post') }}" method="POST">
            <div class="form-group">
                <label for="login_email">Email</label>
                <input
                    type="email"
                    name="email"
                    id="login_email"
                    value="{{ email or request.args.get('email', '') }}"
                    placeholder="กรอก Email"
                    required
                >
            </div>

            <input type="hidden" name="next" value="{{ next_url or request.args.get('next', '') }}">

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label for="login_password" style="margin-bottom: 0;">รหัสผ่าน</label>
                    <a href="{{ url_for('forgot_password') }}" style="font-size: 13px; color: #e85d87; text-decoration: none; font-weight: 600;">
                        ลืมรหัสผ่าน?
                    </a>
                </div>

                <div class="password-field-wrapper">
                    <input
                        type="password"
                        name="password"
                        id="login_password"
                        placeholder="กรอกรหัสผ่าน"
                        required
                    >
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('login_password', this)" title="กดเพื่อแสดงรหัสผ่าน" aria-label="Toggle password visibility">
                        <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        <svg class="eye-open" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="auth-button"
            >
                เข้าสู่ระบบ
            </button>
        </form>

        <p class="auth-footer">
            ยังไม่มีบัญชี?
            <a href="{{ url_for('register', email=email or request.args.get('email', '')) }}">
                สมัครสมาชิก
            </a>
        </p>

        <a
            href="{{ url_for('home') }}"
            class="back-home"
        >
            ← กลับหน้าแรก
        </a>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const eyeOpen = btn.querySelector(".eye-open");
    const eyeClosed = btn.querySelector(".eye-closed");

    if (input.type === "password") {
        input.type = "text";
        if (eyeOpen) eyeOpen.style.display = "block";
        if (eyeClosed) eyeClosed.style.display = "none";
        btn.setAttribute("title", "กดเพื่อซ่อนรหัสผ่าน");
    } else {
        input.type = "password";
        if (eyeOpen) eyeOpen.style.display = "none";
        if (eyeClosed) eyeClosed.style.display = "block";
        btn.setAttribute("title", "กดเพื่อแสดงรหัสผ่าน");
    }
}

// จดจำและคืนค่า Email ในหน้า Login เพื่อไม่ให้หายเมื่อกรอกรหัสผ่านผิด
document.addEventListener("DOMContentLoaded", function() {
    const emailInput = document.getElementById("login_email");
    const pwdInput = document.getElementById("login_password");

    if (emailInput) {
        if (!emailInput.value) {
            const savedEmail = sessionStorage.getItem("cat_spa_login_email");
            if (savedEmail) {
                emailInput.value = savedEmail;
            }
        } else {
            sessionStorage.setItem("cat_spa_login_email", emailInput.value);
        }

        emailInput.addEventListener("input", function() {
            sessionStorage.setItem("cat_spa_login_email", this.value.trim());
        });

        // หากมี Email อยู่แล้ว ให้โฟกัสที่ช่องกรอกรหัสผ่านทันที เพื่อความสะดวก
        if (emailInput.value && pwdInput) {
            pwdInput.focus();
        }
    }
});
</script>

</body>

</html>
